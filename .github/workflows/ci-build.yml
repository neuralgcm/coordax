name: CI

on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pytest-job:
    name: "python ${{ matrix.python-version }} (${{ matrix.variant }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        variant: ["all dependencies", "min dependencies"]
        include:
          - variant: "all dependencies"
            extras: "complete,tests"
          - variant: "min dependencies"
            extras: "tests"
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install Coordax (${{ matrix.variant }})
      run: |
        pip install -e .
        python -c "import coordax"
        pip install -e .[${{ matrix.extras }}]
    - name: Run unit tests
      run: |
        pytest -v coordax

  # Auto-publish when version is increased
  publish-job:
    if: |
      github.repository == 'neuralgcm/coordax'
      && github.ref == 'refs/heads/main'
    needs: pytest-job
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Check version and build if new
        id: check_version
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip build packaging
          python3 -m build
          LOCAL_VER=$(python3 - <<'PY'
          import email, glob, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[0]
          with zipfile.ZipFile(whl) as zf:
            meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
            print(email.message_from_bytes(zf.read(meta))["Version"].strip())
          PY
          )
          PYPI_VER=$(python3 -c "import json, urllib.request; print(json.loads(urllib.request.urlopen('https://pypi.org/pypi/coordax/json').read())['info']['version'])")
          echo "local_ver=${LOCAL_VER}" >> "$GITHUB_OUTPUT"
          if python3 -c "from packaging.version import Version; raise SystemExit(0 if Version('${LOCAL_VER}') > Version('${PYPI_VER}') else 1)"; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release tag if new version
        if: steps.check_version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEW_TAG: v${{ steps.check_version.outputs.local_ver }}
        run: |
          if ! gh release view "${NEW_TAG}" >/dev/null 2>&1; then
            gh release create "${NEW_TAG}" --target "${{ github.sha }}" --title "${NEW_TAG}" --generate-notes
          fi

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        if: steps.check_version.outputs.should_publish == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        if: steps.check_version.outputs.should_publish == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Clean up failed staging attempt for this exact version (if any)
        if: steps.check_version.outputs.should_publish == 'true'
        id: exit_gate_cleanup
        run: |
          set -euo pipefail
          PKG_VER=$(python3 - <<'PY'
          import email, glob, tarfile, zipfile
          files = sorted(glob.glob("dist/**/*.whl", recursive=True) + glob.glob("dist/**/*.tar.gz", recursive=True))
          assert files, "No distributions found in dist/"
          f = files[0]
          if f.endswith(".whl"):
            with zipfile.ZipFile(f) as zf:
              meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
              raw = zf.read(meta).decode()
          else:
            with tarfile.open(f) as tf:
              info = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]
              raw = tf.extractfile(info).read().decode()
          print(email.message_from_string(raw)["Version"].strip())
          PY
          )
          echo "pkg_ver=${PKG_VER}" >> "$GITHUB_OUTPUT"
          if gcloud artifacts versions describe "${PKG_VER}" \
            --package="coordax" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="coordax--pypi" >/dev/null 2>&1; then
            gcloud artifacts versions delete "${PKG_VER}" \
              --package="coordax" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="coordax--pypi" \
              --quiet
          fi

      - name: Stage distributions to OSS Exit Gate and upload manifest
        if: steps.check_version.outputs.should_publish == 'true'
        env:
          PKG_VER: ${{ steps.exit_gate_cleanup.outputs.pkg_ver }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          DIST_FILES=(dist/**/*.whl dist/**/*.tar.gz)
          python3 -m pip install --upgrade twine
          TWINE_PASSWORD="$(gcloud auth print-access-token)"
          python3 -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/coordax--pypi/" \
            -u oauth2accesstoken \
            -p "${TWINE_PASSWORD}" \
            "${DIST_FILES[@]}"
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "coordax",
                    "version": "${PKG_VER}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/coordax/pypi/manifests/manifest-${PKG_VER}-${RUN_ID}-${RUN_ATTEMPT}.json"
